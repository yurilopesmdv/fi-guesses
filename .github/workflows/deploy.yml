name: Deploy

# Tudo que entra na main vai pro ar:
#  - app (JS) via EAS Update no canal "preview" (é o canal que o APK e o Expo Go da família usam)
#  - versão web + página de convite via EAS Hosting
#  - banco (migrations) e Edge Function, só quando a pasta supabase/ muda
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  app:
    name: App (EAS Update + Web)
    needs: supabase
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_LIVE_ENABLED: ${{ vars.EXPO_PUBLIC_LIVE_ENABLED || 'false' }}
      APK_URL: ${{ vars.APK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Publicar JS (EAS Update)
        env:
          UPDATE_MESSAGE: ${{ github.event.head_commit.message || 'manual' }}
        run: node scripts/eas.mjs update --channel preview --environment preview --platform all --non-interactive --message "$UPDATE_MESSAGE"
      - name: Publicar web + página de convite (EAS Hosting)
        run: |
          npx expo export --platform web
          node scripts/prepare-web.mjs
          node scripts/eas.mjs deploy --prod --non-interactive

  supabase:
    name: Banco + Edge Function
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'tqbftaqkqtjouovyvrkq' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            supabase:
              - 'supabase/**'
              - 'scripts/setup-supabase.mjs'
              - 'scripts/deploy-function.mjs'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/deploy.yml'
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.supabase == 'true' || github.event_name == 'workflow_dispatch'
        with:
          node-version: '22'
      - name: Validar formato da credencial Supabase
        if: steps.changes.outputs.supabase == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          node --input-type=module <<'JS'
          const token = process.env.SUPABASE_ACCESS_TOKEN ?? '';
          if (!/^sbp_[A-Za-z0-9]+$/.test(token)) {
            console.error('SUPABASE_ACCESS_TOKEN deve conter somente o token pessoal sbp_, sem nome da variável, aspas ou espaços.');
            process.exit(1);
          }
          JS
      - name: Migrations
        if: steps.changes.outputs.supabase == 'true' || github.event_name == 'workflow_dispatch'
        run: node scripts/setup-supabase.mjs "$SUPABASE_PROJECT_REF"
      - name: Dependências para bundle da função
        if: steps.changes.outputs.supabase == 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci
      - name: Edge Function
        if: steps.changes.outputs.supabase == 'true' || github.event_name == 'workflow_dispatch'
        run: node scripts/deploy-function.mjs sync-series "$SUPABASE_PROJECT_REF"

      - name: Coletor de notícias
        if: steps.changes.outputs.supabase == 'true' || github.event_name == 'workflow_dispatch'
        run: node scripts/deploy-function.mjs sync-news "$SUPABASE_PROJECT_REF"
